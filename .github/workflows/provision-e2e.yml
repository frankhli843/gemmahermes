name: Provision E2E

on:
  pull_request:
    paths:
      - "src/gemmahermes/**"
      - "src/commands/provision.ts"
      - "src/cli/program/register.provision.ts"
      - "test/e2e/Dockerfile.provision"
      - "test/e2e/provision-e2e.sh"
      - ".github/workflows/provision-e2e.yml"
  workflow_dispatch:
    inputs:
      backend:
        description: "Backend to test (ollama, llama-cpp, all)"
        required: false
        default: "ollama"

concurrency:
  group: provision-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provision-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [ollama, llama-cpp]
    steps:
      - uses: actions/checkout@v4

      - name: Build E2E image
        run: |
          docker build \
            -f test/e2e/Dockerfile.provision \
            -t gemmahermes-provision-e2e \
            .

      - name: Run E2E (${{ matrix.backend }})
        run: |
          docker run --rm \
            gemmahermes-provision-e2e \
            ${{ matrix.backend }}
